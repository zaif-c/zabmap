[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "zabmap_api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler",
    "flask",
    "flask_cors",
    "gunicorn",
    "icecream",
    "logging",
    "peewee",
    "peewee-migrate>=1.15.0",
    "psycopg2",
    "pyjwt[crypto]",
    "requests",
]

[project.scripts]
zabmap_api = "zabmap_api.main:run"
zabmap_sync = "zabmap_api.scheduler:run"
zabmap_migrate = "zabmap_api.migrate:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
